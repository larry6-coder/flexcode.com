// ---------- storage helpers (browser localStorage — persists per browser, per device) ----------
const encode = (s) => {
  try { return btoa(unescape(encodeURIComponent(s))); } catch { return btoa(s); }
};

const genId = () => `sug_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

async function listAll(prefix) {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(prefix)) keys.push(k);
  }
  return keys;
}

async function getJSON(key) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch {
    return null;
  }
}

async function setJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}

const ADMIN_USERNAME = "admin";
const ADMIN_DEFAULT_PASSWORD = "Maoni@2024";
const EMAIL_SETTINGS_KEY = "settings:email";

// Sends via EmailJS (https://www.emailjs.com) — a browser-safe email API
// that doesn't need a hidden server secret. Silently no-ops if not configured.
async function sendEmailNotification(settings, { to_email, to_name, subject, heading, message_body }) {
  if (!settings || !settings.serviceId || !settings.templateId || !settings.publicKey || !to_email) {
    return { ok: false, reason: "not configured" };
  }
  try {
    const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: settings.serviceId,
        template_id: settings.templateId,
        user_id: settings.publicKey,
        template_params: { to_email, to_name, subject, heading, message_body },
      }),
    });
    return { ok: res.ok };
  } catch (e) {
    return { ok: false, reason: e.message };
  }
}

function MaoniApp() {
  const [booting, setBooting] = useState(true);
  const [screen, setScreen] = useState("auth"); // auth | client | admin
  const [authMode, setAuthMode] = useState("login"); // login | signup
  const [currentUser, setCurrentUser] = useState(null);

  const [formUsername, setFormUsername] = useState("");
  const [formPassword, setFormPassword] = useState("");
  const [formCompany, setFormCompany] = useState("");
  const [formEmail, setFormEmail] = useState("");
  const [authError, setAuthError] = useState("");
  const [authBusy, setAuthBusy] = useState(false);

  const [emailSettings, setEmailSettings] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [settingsForm, setSettingsForm] = useState({
    notifyEmail: "",
    serviceId: "",
    templateId: "",
    publicKey: "",
  });
  const [settingsSaved, setSettingsSaved] = useState(false);
  const [adminFlash, setAdminFlash] = useState("");

  const [submissions, setSubmissions] = useState([]);
  const [subsLoading, setSubsLoading] = useState(false);

  const [newTitle, setNewTitle] = useState("");
  const [newMessage, setNewMessage] = useState("");
  const [sendBusy, setSendBusy] = useState(false);
  const [flash, setFlash] = useState("");

  const [adminFilter, setAdminFilter] = useState("all"); // all | pending | completed

  // Seed the admin account once.
  useEffect(() => {
    (async () => {
      const existing = await getJSON(`users:${ADMIN_USERNAME}`);
      if (!existing) {
        await setJSON(`users:${ADMIN_USERNAME}`, {
          username: ADMIN_USERNAME,
          password: encode(ADMIN_DEFAULT_PASSWORD),
          role: "admin",
          company: "Maoni Admin",
          createdAt: Date.now(),
        });
      }
      setBooting(false);
    })();
  }, []);

  const loadSubmissions = useCallback(async (user) => {
    setSubsLoading(true);
    const keys = await listAll("submissions:");
    const items = (await Promise.all(keys.map((k) => getJSON(k)))).filter(Boolean);
    items.sort((a, b) => b.createdAt - a.createdAt);
    const scoped =
      user && user.role === "admin"
        ? items
        : items.filter((s) => s.username === user.username);
    setSubmissions(scoped);
    setSubsLoading(false);
  }, []);

  useEffect(() => {
    if (currentUser) loadSubmissions(currentUser);
  }, [currentUser, loadSubmissions]);

  function resetAuthForm() {
    setFormUsername("");
    setFormPassword("");
    setFormCompany("");
    setFormEmail("");
    setAuthError("");
  }

  const loadEmailSettings = useCallback(async () => {
    const s = await getJSON(EMAIL_SETTINGS_KEY);
    setEmailSettings(s);
    if (s) setSettingsForm(s);
    return s;
  }, []);

  useEffect(() => {
    if (currentUser && currentUser.role === "admin") loadEmailSettings();
  }, [currentUser, loadEmailSettings]);

  async function handleSaveSettings(e) {
    e.preventDefault();
    const cleaned = {
      notifyEmail: settingsForm.notifyEmail.trim(),
      serviceId: settingsForm.serviceId.trim(),
      templateId: settingsForm.templateId.trim(),
      publicKey: settingsForm.publicKey.trim(),
    };
    const ok = await setJSON(EMAIL_SETTINGS_KEY, cleaned);
    if (ok) {
      setEmailSettings(cleaned);
      setSettingsSaved(true);
      setTimeout(() => setSettingsSaved(false), 2500);
    }
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    setAuthError("");
    const uname = formUsername.trim().toLowerCase();
    const pass = formPassword;

    if (!uname || !pass) {
      setAuthError("Enter a username and password.");
      return;
    }

    setAuthBusy(true);
    try {
      if (authMode === "signup") {
        if (uname === ADMIN_USERNAME) {
          setAuthError("That username is reserved.");
          return;
        }
        if (pass.length < 4) {
          setAuthError("Password needs at least 4 characters.");
          return;
        }
        const existing = await getJSON(`users:${uname}`);
        if (existing) {
          setAuthError("That username is already taken.");
          return;
        }
        const user = {
          username: uname,
          password: encode(pass),
          role: "client",
          company: formCompany.trim() || uname,
          email: formEmail.trim(),
          createdAt: Date.now(),
        };
        const ok = await setJSON(`users:${uname}`, user);
        if (!ok) {
          setAuthError("Couldn't create your account. Try again.");
          return;
        }
        setCurrentUser(user);
        setScreen("client");
        resetAuthForm();
      } else {
        const user = await getJSON(`users:${uname}`);
        if (!user || user.password !== encode(pass)) {
          setAuthError("Username or password is incorrect.");
          return;
        }
        setCurrentUser(user);
        setScreen(user.role === "admin" ? "admin" : "client");
        resetAuthForm();
      }
    } finally {
      setAuthBusy(false);
    }
  }

  function handleLogout() {
    setCurrentUser(null);
    setSubmissions([]);
    setScreen("auth");
    setAuthMode("login");
    resetAuthForm();
  }

  async function handleSendSuggestion(e) {
    e.preventDefault();
    if (!newTitle.trim() || !newMessage.trim()) return;
    setSendBusy(true);
    const item = {
      id: genId(),
      username: currentUser.username,
      company: currentUser.company,
      title: newTitle.trim(),
      message: newMessage.trim(),
      status: "pending",
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    const ok = await setJSON(`submissions:${item.id}`, item);
    if (ok) {
      setNewTitle("");
      setNewMessage("");
      const settings = await getJSON(EMAIL_SETTINGS_KEY);
      let notified = false;
      if (settings && settings.notifyEmail) {
        const res = await sendEmailNotification(settings, {
          to_email: settings.notifyEmail,
          to_name: "Admin",
          subject: `New suggestion from ${currentUser.company}`,
          heading: `${currentUser.company} sent a new suggestion: "${item.title}"`,
          message_body: item.message,
        });
        notified = res.ok;
      }
      setFlash(notified ? "Suggestion sent — admin notified by email." : "Suggestion sent.");
      setTimeout(() => setFlash(""), 3000);
      loadSubmissions(currentUser);
    }
    setSendBusy(false);
  }

  async function toggleStatus(item) {
    const updated = {
      ...item,
      status: item.status === "pending" ? "completed" : "pending",
      updatedAt: Date.now(),
    };
    const ok = await setJSON(`submissions:${item.id}`, updated);
    if (ok) {
      let notified = false;
      if (updated.status === "completed") {
        const settings = emailSettings || (await getJSON(EMAIL_SETTINGS_KEY));
        const client = await getJSON(`users:${item.username}`);
        if (settings && client && client.email) {
          const res = await sendEmailNotification(settings, {
            to_email: client.email,
            to_name: client.company || client.username,
            subject: `Your suggestion is complete: "${item.title}"`,
            heading: `Good news — we've completed your suggestion "${item.title}".`,
            message_body: item.message,
          });
          notified = res.ok;
        }
      }
      setAdminFlash(
        updated.status === "completed"
          ? notified
            ? "Marked complete — client notified by email."
            : "Marked complete."
          : "Marked pending."
      );
      setTimeout(() => setAdminFlash(""), 3000);
      loadSubmissions(currentUser);
    }
  }

  const pendingCount = submissions.filter((s) => s.status === "pending").length;
  const visibleAdminItems =
    adminFilter === "all" ? submissions : submissions.filter((s) => s.status === adminFilter);

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  return (
    <div className="maoni-root">

        .maoni-root h1, .maoni-root h2, .maoni-root h3 {
          font-family: 'Sora', sans-serif;
          margin: 0;
          letter-spacing: -0.01em;
        }
        .maoni-root button { font-family: 'Inter', sans-serif; cursor: pointer; }

        }

        /* ---------- auth screen ---------- */

          display: grid;
          grid-template-columns: 1.1fr 1fr;

        .panel-sub { color: var(--text-dim); font-size: 13.5px; margin-bottom: 20px; }
        textarea.field-input {
          padding: 11px 13px;
          resize: vertical;
          min-height: 96px;
          line-height: 1.5;
        }
        .flash-msg {
          background: var(--success-bg);
          color: var(--success);
          border: 1px solid rgba(63,174,107,0.35);
          font-size: 13px;
          padding: 9px 12px;
          border-radius: 8px;
          margin-top: 12px;
        }

        .list-heading {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 16px;
        }
        .list-heading h2 { font-size: 17px; font-weight: 600; }
        .count-tag { font-size: 12.5px; color: var(--text-dim); }

        .sug-row {
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px 18px;
          margin-bottom: 12px;
          background: var(--panel);
        }
        .sug-row-top {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 12px;
        }
        .sug-title { font-size: 15px; font-weight: 500; }
        .sug-message {
          color: var(--text-dim);
          font-size: 13.5px;
          line-height: 1.55;
          margin-top: 6px;
        }
        .sug-meta {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-top: 12px;
          font-size: 12.5px;
          color: var(--text-dim);
        }
        .sug-client { font-weight: 500; color: var(--text); }

        .empty-state {
          border: 1px dashed var(--border);
          border-radius: 10px;
          padding: 30px 20px;
          text-align: left;
          color: var(--text-dim);
          font-size: 14px;
        }

        .filter-row {
          display: flex;
          gap: 8px;
          margin-bottom: 20px;
        }
        .filter-chip {
          border: 1px solid var(--border);
          background: var(--panel);
          color: var(--text-dim);
          font-size: 13px;
          padding: 7px 14px;
          border-radius: 100px;
          transition: all 0.15s;
        }
        .filter-chip.active {
          background: var(--elevated);
          border-color: var(--accent);
          color: var(--text);
        }

        .status-btn {
          display: flex; align-items: center; gap: 6px;
          border: 1px solid var(--border);
          background: var(--elevated);
          color: var(--text-dim);
          font-size: 12.5px;
          font-weight: 500;
          padding: 7px 12px;
          border-radius: 8px;
          white-space: nowrap;
          transition: border-color 0.15s, color 0.15s;
        }
        .status-btn.is-completed { color: var(--success); border-color: rgba(63,174,107,0.4); }
        .status-btn.is-pending { color: var(--accent-strong); border-color: rgba(232,163,61,0.4); }
        .status-btn:hover { filter: brightness(1.15); }

        .modal-overlay {
          position: fixed;
          inset: 0;
          background: rgba(5,6,9,0.7);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          z-index: 60;
        }
        .modal-box {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 26px;
          max-width: 440px;
          width: 100%;
          max-height: 90vh;
          overflow-y: auto;
        }
        .modal-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 6px;
        }
        .modal-box code {
          background: var(--elevated);
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 1px 5px;
          font-size: 12.5px;
          color: var(--accent-strong);
        }
      `}</style>

      {booting ? (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-dim)", fontSize: 14 }}>
          Loading…
        </div>
      ) : screen === "auth" ? (
        <div className="auth-wrap">
          <div className="auth-brand">
            <div className="wordmark">
              <span className="wordmark-dot" />
              Maoni
            </div>
            <div className="auth-hero">
              <h1>Every idea, tracked to done.</h1>
              <p>
                Send a suggestion about your page whenever it comes to mind. We see it the
                moment it lands, and you'll always know whether it's still pending or already
                shipped.
              </p>
              <div className="mock-card">
                <div className="mock-card-row">
                  <div>
                    <div className="mock-card-title">Move the pricing table higher</div>
                    <div className="mock-card-sub">Sent 3 days ago</div>
                  </div>
                  <span className="pill pill-completed"><CheckCircle2 size={13} /> Completed</span>
                </div>
                <div className="mock-card-row">
                  <div>
                    <div className="mock-card-title">Add a WhatsApp contact button</div>
                    <div className="mock-card-sub">Sent yesterday</div>
                  </div>
                  <span className="pill pill-pending"><Clock3 size={13} /> Pending</span>
                </div>
              </div>
            </div>
            <div className="footnote">Nairobi · built for teams who ship on client feedback</div>
          </div>

          <div className="auth-form-side">
            <div className="auth-card">
              <div className="auth-tabs">
                <button
                  className={`auth-tab ${authMode === "login" ? "active" : ""}`}
                  onClick={() => { setAuthMode("login"); setAuthError(""); }}
                >
                  Log in
                </button>
                <button
                  className={`auth-tab ${authMode === "signup" ? "active" : ""}`}
                  onClick={() => { setAuthMode("signup"); setAuthError(""); }}
                >
                  Sign up
                </button>
              </div>

              <h2 style={{ fontSize: 20, fontWeight: 600, marginBottom: 6 }}>
                {authMode === "login" ? "Welcome back" : "Create your account"}
              </h2>
              <p className="panel-sub" style={{ marginBottom: 22 }}>
                {authMode === "login"
                  ? "Log in to send a suggestion or check on one you already sent."
                  : "Set up an account so we can keep track of what you send us."}
              </p>

              {authError && (
                <div className="auth-err">
                  <AlertCircle size={15} style={{ marginTop: 1, flexShrink: 0 }} />
                  <span>{authError}</span>
                </div>
              )}

              <form onSubmit={handleAuthSubmit}>
                {authMode === "signup" && (
                  <div className="field-group">
                    <label className="field-label">Company or page name</label>
                    <div className="field-input-wrap">
                      <Building2 size={16} />
                      <input
                        className="field-input"
                        placeholder="e.g. Baraka Traders"
                        value={formCompany}
                        onChange={(e) => setFormCompany(e.target.value)}
                      />
                    </div>
                  </div>
                )}
                {authMode === "signup" && (
                  <div className="field-group">
                    <label className="field-label">Email (optional — so we can tell you when we're done)</label>
                    <div className="field-input-wrap">
                      <Mail size={16} />
                      <input
                        className="field-input"
                        type="email"
                        placeholder="you@example.com"
                        value={formEmail}
                        onChange={(e) => setFormEmail(e.target.value)}
                      />
                    </div>
                  </div>
                )}
                <div className="field-group">
                  <label className="field-label">Username</label>
                  <div className="field-input-wrap">
                    <User size={16} />
                    <input
                      className="field-input"
                      placeholder="yourname"
                      value={formUsername}
                      onChange={(e) => setFormUsername(e.target.value)}
                      autoCapitalize="none"
                    />
                  </div>
                </div>
                <div className="field-group">
                  <label className="field-label">Password</label>
                  <div className="field-input-wrap">
                    <Lock size={16} />
                    <input
                      className="field-input"
                      type="password"
                      placeholder="••••••••"
                      value={formPassword}
                      onChange={(e) => setFormPassword(e.target.value)}
                    />
                  </div>
                </div>
                <button className="btn-primary" type="submit" disabled={authBusy}>
                  {authBusy ? "Please wait…" : authMode === "login" ? "Log in" : "Create account"}
                </button>
              </form>

              <div className="admin-hint">
                <ShieldCheck size={14} />
                Admins log in here too, with their admin username and password.
              </div>
            </div>
          </div>
        </div>
      ) : screen === "client" ? (
        <div className="dash">
          <div className="dash-header">
            <div className="wordmark">
              <span className="wordmark-dot" />
              Maoni
            </div>
            <div className="dash-header-right">
              <span className="who">Signed in as <strong>{currentUser.company}</strong></span>
              <button className="logout-btn" onClick={handleLogout}>
                <LogOut size={14} /> Log out
              </button>
            </div>
          </div>

          <div className="dash-body">
            <div className="client-grid">
              <div className="panel-box">
                <h2>Send a suggestion</h2>
                <p className="panel-sub">Tell us what you'd like changed or added on your page.</p>
                <form onSubmit={handleSendSuggestion}>
                  <div className="field-group">
                    <label className="field-label">Title</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="e.g. Update the homepage banner"
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">Details</label>
                    <textarea
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="Describe what you'd like to see"
                      value={newMessage}
                      onChange={(e) => setNewMessage(e.target.value)}
                    />
                  </div>
                  <button className="btn-primary" type="submit" disabled={sendBusy}>
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 7, justifyContent: "center", width: "100%" }}>
                      <Send size={14} /> {sendBusy ? "Sending…" : "Send suggestion"}
                    </span>
                  </button>
                </form>
                {flash && <div className="flash-msg">{flash}</div>}
              </div>

              <div>
                <div className="list-heading">
                  <h2>Your suggestions</h2>
                  <span className="count-tag">{submissions.length} sent</span>
                </div>
                {subsLoading ? (
                  <div className="footnote">Loading…</div>
                ) : submissions.length === 0 ? (
                  <div className="empty-state">
                    Nothing sent yet. Use the form to send your first suggestion — it'll show up
                    here with its status.
                  </div>
                ) : (
                  submissions.map((s) => (
                    <div className="sug-row" key={s.id}>
                      <div className="sug-row-top">
                        <div>
                          <div className="sug-title">{s.title}</div>
                          <div className="sug-message">{s.message}</div>
                        </div>
                        {s.status === "completed" ? (
                          <span className="pill pill-completed"><CheckCircle2 size={13} /> Completed</span>
                        ) : (
                          <span className="pill pill-pending"><Clock3 size={13} /> Pending</span>
                        )}
                      </div>
                      <div className="sug-meta">Sent {formatDate(s.createdAt)}</div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      ) : (
        <div className="dash">
          <div className="dash-header">
            <div className="wordmark">
              <span className="wordmark-dot" />
              Maoni
              <span className="admin-tag">ADMIN</span>
            </div>
            <div className="dash-header-right">
              <button className="icon-btn" onClick={() => setShowSettings(true)} title="Notification settings">
                <Settings size={16} />
              </button>
              <div className="badge-wrap">
                <div className="icon-btn"><Bell size={16} /></div>
                {pendingCount > 0 && <span className="badge-dot">{pendingCount}</span>}
              </div>
              <span className="who">Signed in as <strong>{currentUser.username}</strong></span>
              <button className="logout-btn" onClick={handleLogout}>
                <LogOut size={14} /> Log out
              </button>
            </div>
          </div>

          <div className="dash-body">
            <div className="list-heading">
              <h2>All client suggestions</h2>
              <span className="count-tag">{pendingCount} pending · {submissions.length} total</span>
            </div>

            {adminFlash && <div className="flash-msg" style={{ marginBottom: 16 }}>{adminFlash}</div>}

            <div className="filter-row">
              <button className={`filter-chip ${adminFilter === "all" ? "active" : ""}`} onClick={() => setAdminFilter("all")}>All</button>
              <button className={`filter-chip ${adminFilter === "pending" ? "active" : ""}`} onClick={() => setAdminFilter("pending")}>Pending</button>
              <button className={`filter-chip ${adminFilter === "completed" ? "active" : ""}`} onClick={() => setAdminFilter("completed")}>Completed</button>
            </div>

            {subsLoading ? (
              <div className="footnote">Loading…</div>
            ) : visibleAdminItems.length === 0 ? (
              <div className="empty-state">
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                  <Inbox size={16} />
                  <span style={{ color: "var(--text)" }}>Nothing here yet</span>
                </div>
                No suggestions match this filter right now.
              </div>
            ) : (
              visibleAdminItems.map((s) => (
                <div className="sug-row" key={s.id}>
                  <div className="sug-row-top">
                    <div>
                      <div className="sug-title">{s.title}</div>
                      <div className="sug-message">{s.message}</div>
                    </div>
                    <button
                      className={`status-btn ${s.status === "completed" ? "is-completed" : "is-pending"}`}
                      onClick={() => toggleStatus(s)}
                    >
                      {s.status === "completed" ? <CheckCircle2 size={14} /> : <Clock3 size={14} />}
                      {s.status === "completed" ? "Completed" : "Mark complete"}
                    </button>
                  </div>
                  <div className="sug-meta">
                    <span className="sug-client">{s.company || s.username}</span>
                    <span>· @{s.username}</span>
                    <span>· Sent {formatDate(s.createdAt)}</span>
                  </div>
                </div>
              ))
            )}
          </div>

          {showSettings && (
            <div className="modal-overlay" onClick={() => setShowSettings(false)}>
              <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                <div className="modal-head">
                  <h2 style={{ fontSize: 18, fontWeight: 600 }}>Email notifications</h2>
                  <button className="icon-btn" onClick={() => setShowSettings(false)}>
                    <X size={16} />
                  </button>
                </div>
                <p className="panel-sub" style={{ marginBottom: 18 }}>
                  Powered by EmailJS, a service that can send email straight from the browser —
                  no server needed. Create a free account at emailjs.com, connect your inbox, and
                  make one email template with the variables <code>to_email</code>,{" "}
                  <code>to_name</code>, <code>subject</code>, <code>heading</code> and{" "}
                  <code>message_body</code>. Then paste the three IDs it gives you below.
                </p>
                <form onSubmit={handleSaveSettings}>
                  <div className="field-group">
                    <label className="field-label">Your email (receives new-suggestion alerts)</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      type="email"
                      placeholder="you@example.com"
                      value={settingsForm.notifyEmail}
                      onChange={(e) => setSettingsForm({ ...settingsForm, notifyEmail: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Service ID</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="service_xxxxxxx"
                      value={settingsForm.serviceId}
                      onChange={(e) => setSettingsForm({ ...settingsForm, serviceId: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Template ID</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="template_xxxxxxx"
                      value={settingsForm.templateId}
                      onChange={(e) => setSettingsForm({ ...settingsForm, templateId: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Public Key</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="public key from Account > API Keys"
                      value={settingsForm.publicKey}
                      onChange={(e) => setSettingsForm({ ...settingsForm, publicKey: e.target.value })}
                    />
                  </div>
                  <button className="btn-primary" type="submit">
                    Save settings
                  </button>
                  {settingsSaved && (
                    <div className="flash-msg" style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6 }}>
                      <CheckCircle size={14} /> Settings saved.
                    </div>
                  )}
                </form>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MaoniApp />);
</script>
</body>
</html>
