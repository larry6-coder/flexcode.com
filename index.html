<div id="root"></div>

<!-- React (no build step needed — this file transpiles JSX in the browser) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback, useRef } = React;

// ============================================================================
// SUPABASE CONFIG — fill these in from Project Settings > API in Supabase.
// The anon key is safe to expose publicly; row-level security does the rest.
// ============================================================================
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M12 8v5" /><path d="M12 16h.01" /></Icon>;
const Settings = (p) => <Icon {...p}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.65 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.65a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.35 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.04z" /></Icon>;
const X = (p) => <Icon {...p}><path d="M18 6 6 18" /><path d="M6 6l12 12" /></Icon>;
const Mail = (p) => <Icon {...p}><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></Icon>;
const MessageSquare = (p) => <Icon {...p}><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></Icon>;
const Gift = (p) => <Icon {...p}><rect x="3" y="8" width="18" height="13" rx="1" /><path d="M12 8v13M3 12h18" /><path d="M12 8c-1.5 0-4-1-4-3a2 2 0 0 1 4 0c0-1.5 1-3 2.5-3S16 3.5 16 5a2 2 0 0 1-4 3z" /></Icon>;
const Link2 = (p) => <Icon {...p}><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1" /><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" /></Icon>;

const EMAIL_SETTINGS_KEY = "maoni:settings:email";

// Sends via EmailJS (https://www.emailjs.com) — a browser-safe email API
// that doesn't need a hidden server secret. Silently no-ops if not configured.
async function sendEmailNotification(settings, { to_email, to_name, subject, heading, message_body }) {
  if (!settings || !settings.serviceId || !settings.templateId || !settings.publicKey || !to_email) {
    return { ok: false, reason: "not configured" };
  }
  try {
    const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: settings.serviceId,
        template_id: settings.templateId,
        user_id: settings.publicKey,
        template_params: { to_email, to_name, subject, heading, message_body },
      }),
    });
    return { ok: res.ok };
  } catch (e) {
    return { ok: false, reason: e.message };
  }
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function MaoniApp() {
  const [booting, setBooting] = useState(true);
  const [screen, setScreen] = useState("auth"); // auth | client | admin
  const [authMode, setAuthMode] = useState("login"); // login | signup
  const [currentUser, setCurrentUser] = useState(null); // { id, email, company, role }

  const [formEmail, setFormEmail] = useState("");
  const [formPassword, setFormPassword] = useState("");
  const [formCompany, setFormCompany] = useState("");
  const [authError, setAuthError] = useState("");
  const [authNotice, setAuthNotice] = useState("");
  const [authBusy, setAuthBusy] = useState(false);

  const [emailSettings, setEmailSettings] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [settingsForm, setSettingsForm] = useState({
    notifyEmail: "",
    serviceId: "",
    templateId: "",
    publicKey: "",
  });
  const [settingsSaved, setSettingsSaved] = useState(false);
  const [adminFlash, setAdminFlash] = useState("");

  const [submissions, setSubmissions] = useState([]);
  const [subsLoading, setSubsLoading] = useState(false);

  const [newTitle, setNewTitle] = useState("");
  const [newMessage, setNewMessage] = useState("");
  const [sendBusy, setSendBusy] = useState(false);
  const [flash, setFlash] = useState("");

  const [adminFilter, setAdminFilter] = useState("all"); // all | pending | completed
  const [adminTab, setAdminTab] = useState("suggestions"); // suggestions | clients

  // ---- chat + results state (shared shape, used by both client + admin views) ----
  const [myMessages, setMyMessages] = useState([]); // client's own thread
  const [myResults, setMyResults] = useState([]);
  const [chatDraft, setChatDraft] = useState("");
  const [chatSending, setChatSending] = useState(false);
  const chatScrollRef = useRef(null);

  const [clients, setClients] = useState([]); // admin: list of client profiles
  const [selectedClientId, setSelectedClientId] = useState(null);
  const [adminChatMessages, setAdminChatMessages] = useState([]);
  const [adminChatDraft, setAdminChatDraft] = useState("");
  const [adminChatSending, setAdminChatSending] = useState(false);
  const [clientResults, setClientResults] = useState([]);
  const [clientSuggestions, setClientSuggestions] = useState([]);
  const [resultTitle, setResultTitle] = useState("");
  const [resultBody, setResultBody] = useState("");
  const [resultLink, setResultLink] = useState("");
  const [resultBusy, setResultBusy] = useState(false);
  const [resultFlash, setResultFlash] = useState("");
  const adminChatScrollRef = useRef(null);

  // ---------------------------------------------------------------------
  // Bootstrapping: restore session if one exists
  // ---------------------------------------------------------------------
  useEffect(() => {
    (async () => {
      const { data } = await sb.auth.getSession();
      if (data && data.session) {
        await resolveUser(data.session.user);
      }
      setBooting(false);
    })();
  }, []);

  async function resolveUser(authUser) {
    const [{ data: adminRow }, { data: profile }] = await Promise.all([
      sb.from("admins").select("user_id").eq("user_id", authUser.id).maybeSingle(),
      sb.from("profiles").select("*").eq("id", authUser.id).maybeSingle(),
    ]);
    const user = {
      id: authUser.id,
      email: authUser.email,
      company: (profile && profile.full_name) || authUser.email,
      role: adminRow ? "admin" : "client",
    };
    setCurrentUser(user);
    setScreen(user.role === "admin" ? "admin" : "client");
    return user;
  }

  function resetAuthForm() {
    setFormEmail("");
    setFormPassword("");
    setFormCompany("");
    setAuthError("");
    setAuthNotice("");
  }

  const loadEmailSettings = useCallback(async () => {
    let s = null;
    try {
      const raw = localStorage.getItem(EMAIL_SETTINGS_KEY);
      s = raw ? JSON.parse(raw) : null;
    } catch {}
    setEmailSettings(s);
    if (s) setSettingsForm(s);
    return s;
  }, []);

  useEffect(() => {
    if (currentUser && currentUser.role === "admin") loadEmailSettings();
  }, [currentUser, loadEmailSettings]);

  async function handleSaveSettings(e) {
    e.preventDefault();
    const cleaned = {
      notifyEmail: settingsForm.notifyEmail.trim(),
      serviceId: settingsForm.serviceId.trim(),
      templateId: settingsForm.templateId.trim(),
      publicKey: settingsForm.publicKey.trim(),
    };
    try {
      localStorage.setItem(EMAIL_SETTINGS_KEY, JSON.stringify(cleaned));
      setEmailSettings(cleaned);
      setSettingsSaved(true);
      setTimeout(() => setSettingsSaved(false), 2500);
    } catch {}
  }

  // ---------------------------------------------------------------------
  // Auth — one plain form for everyone. Nothing here reveals that an
  // admin login exists; role is decided after sign-in, server-side.
  // ---------------------------------------------------------------------
  async function handleAuthSubmit(e) {
    e.preventDefault();
    setAuthError("");
    setAuthNotice("");
    const email = formEmail.trim().toLowerCase();
    const pass = formPassword;

    if (!email || !pass) {
      setAuthError("Enter your email and password.");
      return;
    }

    setAuthBusy(true);
    try {
      if (authMode === "signup") {
        if (pass.length < 6) {
          setAuthError("Password needs at least 6 characters.");
          return;
        }
        const { data, error } = await sb.auth.signUp({
          email,
          password: pass,
          options: { data: { full_name: formCompany.trim() || email } },
        });
        if (error) {
          setAuthError(error.message);
          return;
        }
        if (data.session) {
          await resolveUser(data.user);
          resetAuthForm();
        } else {
          setAuthNotice("Check your email to confirm your account, then log in.");
          setAuthMode("login");
          setFormPassword("");
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) {
          setAuthError("Email or password is incorrect.");
          return;
        }
        await resolveUser(data.user);
        resetAuthForm();
      }
    } finally {
      setAuthBusy(false);
    }
  }

  async function handleLogout() {
    await sb.auth.signOut();
    setCurrentUser(null);
    setSubmissions([]);
    setMyMessages([]);
    setMyResults([]);
    setClients([]);
    setSelectedClientId(null);
    setScreen("auth");
    setAuthMode("login");
    resetAuthForm();
  }

  // ---------------------------------------------------------------------
  // Client side: suggestions, chat with admin, results received
  // ---------------------------------------------------------------------
  const loadClientData = useCallback(async (user) => {
    setSubsLoading(true);
    const [{ data: sugs }, { data: msgs }, { data: res }] = await Promise.all([
      sb.from("suggestions").select("*").eq("client_id", user.id).order("created_at", { ascending: false }),
      sb.from("messages").select("*").eq("client_id", user.id).order("created_at", { ascending: true }),
      sb.from("results").select("*").eq("client_id", user.id).order("created_at", { ascending: false }),
    ]);
    setSubmissions(sugs || []);
    setMyMessages(msgs || []);
    setMyResults(res || []);
    setSubsLoading(false);
    // mark admin messages as read
    await sb.from("messages")
      .update({ read_at: new Date().toISOString() })
      .eq("client_id", user.id)
      .eq("sender_role", "admin")
      .is("read_at", null);
  }, []);

  useEffect(() => {
    if (currentUser && currentUser.role === "client") {
      loadClientData(currentUser);
      const channel = sb
        .channel(`client-${currentUser.id}`)
        .on("postgres_changes", { event: "*", schema: "public", table: "messages", filter: `client_id=eq.${currentUser.id}` },
          () => loadClientData(currentUser))
        .on("postgres_changes", { event: "*", schema: "public", table: "suggestions", filter: `client_id=eq.${currentUser.id}` },
          () => loadClientData(currentUser))
        .on("postgres_changes", { event: "*", schema: "public", table: "results", filter: `client_id=eq.${currentUser.id}` },
          () => loadClientData(currentUser))
        .subscribe();
      return () => sb.removeChannel(channel);
    }
  }, [currentUser, loadClientData]);

  useEffect(() => {
    if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
  }, [myMessages]);

  async function handleSendSuggestion(e) {
    e.preventDefault();
    if (!newTitle.trim() || !newMessage.trim()) return;
    setSendBusy(true);
    const { error } = await sb.from("suggestions").insert({
      client_id: currentUser.id,
      title: newTitle.trim(),
      body: newMessage.trim(),
      status: "pending",
    });
    if (!error) {
      setNewTitle("");
      setNewMessage("");
      const settings = emailSettings || (await loadEmailSettings());
      let notified = false;
      if (settings && settings.notifyEmail) {
        const res = await sendEmailNotification(settings, {
          to_email: settings.notifyEmail,
          to_name: "Admin",
          subject: `New suggestion from ${currentUser.company}`,
          heading: `${currentUser.company} sent a new suggestion: "${newTitle.trim()}"`,
          message_body: newMessage.trim(),
        });
        notified = res.ok;
      }
      setFlash(notified ? "Suggestion sent — admin notified by email." : "Suggestion sent.");
      setTimeout(() => setFlash(""), 3000);
      loadClientData(currentUser);
    }
    setSendBusy(false);
  }

  async function handleClientSendChat(e) {
    e.preventDefault();
    if (!chatDraft.trim()) return;
    setChatSending(true);
    const { error } = await sb.from("messages").insert({
      client_id: currentUser.id,
      sender_role: "client",
      body: chatDraft.trim(),
    });
    if (!error) {
      setChatDraft("");
      const settings = emailSettings || (await loadEmailSettings());
      if (settings && settings.notifyEmail) {
        sendEmailNotification(settings, {
          to_email: settings.notifyEmail,
          to_name: "Admin",
          subject: `New message from ${currentUser.company}`,
          heading: `${currentUser.company} sent you a message`,
          message_body: chatDraft.trim(),
        });
      }
      loadClientData(currentUser);
    }
    setChatSending(false);
  }

  // ---------------------------------------------------------------------
  // Admin side: all suggestions, client list, per-client chat + results
  // ---------------------------------------------------------------------
  const loadAllSuggestions = useCallback(async () => {
    setSubsLoading(true);
    const { data } = await sb
      .from("suggestions")
      .select("*, profiles(full_name, email)")
      .order("created_at", { ascending: false });
    setSubmissions(data || []);
    setSubsLoading(false);
  }, []);

  const loadClients = useCallback(async (user) => {
    const { data } = await sb.from("profiles").select("*").neq("id", user.id).order("full_name");
    setClients(data || []);
  }, []);

  useEffect(() => {
    if (currentUser && currentUser.role === "admin") {
      loadAllSuggestions();
      loadClients(currentUser);
      const channel = sb
        .channel("admin-all")
        .on("postgres_changes", { event: "*", schema: "public", table: "suggestions" }, () => loadAllSuggestions())
        .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, () => {
          if (selectedClientId) loadClientThread(selectedClientId);
        })
        .subscribe();
      return () => sb.removeChannel(channel);
    }
    // eslint-disable-next-line
  }, [currentUser, loadAllSuggestions, loadClients]);

  const loadClientThread = useCallback(async (clientId) => {
    const [{ data: msgs }, { data: res }, { data: sugs }] = await Promise.all([
      sb.from("messages").select("*").eq("client_id", clientId).order("created_at", { ascending: true }),
      sb.from("results").select("*").eq("client_id", clientId).order("created_at", { ascending: false }),
      sb.from("suggestions").select("*").eq("client_id", clientId).order("created_at", { ascending: false }),
    ]);
    setAdminChatMessages(msgs || []);
    setClientResults(res || []);
    setClientSuggestions(sugs || []);
    await sb.from("messages")
      .update({ read_at: new Date().toISOString() })
      .eq("client_id", clientId)
      .eq("sender_role", "client")
      .is("read_at", null);
  }, []);

  useEffect(() => {
    if (selectedClientId) loadClientThread(selectedClientId);
  }, [selectedClientId, loadClientThread]);

  useEffect(() => {
    if (adminChatScrollRef.current) adminChatScrollRef.current.scrollTop = adminChatScrollRef.current.scrollHeight;
  }, [adminChatMessages]);

  async function toggleStatus(item) {
    const nextStatus = item.status === "pending" ? "completed" : "pending";
    const { error } = await sb.from("suggestions").update({ status: nextStatus }).eq("id", item.id);
    if (!error) {
      let notified = false;
      if (nextStatus === "completed") {
        const settings = emailSettings || (await loadEmailSettings());
        const clientEmail = item.profiles && item.profiles.email;
        if (settings && settings.notifyEmail && clientEmail) {
          const res = await sendEmailNotification(settings, {
            to_email: clientEmail,
            to_name: (item.profiles && item.profiles.full_name) || "there",
            subject: `Your suggestion is complete: "${item.title}"`,
            heading: `Good news — we've completed your suggestion "${item.title}".`,
            message_body: item.body,
          });
          notified = res.ok;
        }
      }
      setAdminFlash(
        nextStatus === "completed"
          ? notified
            ? "Marked complete — client notified by email."
            : "Marked complete."
          : "Marked pending."
      );
      setTimeout(() => setAdminFlash(""), 3000);
      loadAllSuggestions();
    }
  }

  async function handleAdminSendChat(e) {
    e.preventDefault();
    if (!adminChatDraft.trim() || !selectedClientId) return;
    setAdminChatSending(true);
    const { error } = await sb.from("messages").insert({
      client_id: selectedClientId,
      sender_role: "admin",
      body: adminChatDraft.trim(),
    });
    if (!error) {
      setAdminChatDraft("");
      const settings = emailSettings || (await loadEmailSettings());
      const client = clients.find((c) => c.id === selectedClientId);
      if (settings && client && client.email) {
        sendEmailNotification(settings, {
          to_email: client.email,
          to_name: client.full_name || "there",
          subject: "New message from us",
          heading: "You have a new message on your Maoni page",
          message_body: adminChatDraft.trim(),
        });
      }
      loadClientThread(selectedClientId);
    }
    setAdminChatSending(false);
  }

  async function handleSendResult(e) {
    e.preventDefault();
    if (!resultTitle.trim() || !selectedClientId) return;
    setResultBusy(true);
    const { error } = await sb.from("results").insert({
      client_id: selectedClientId,
      title: resultTitle.trim(),
      body: resultBody.trim() || null,
      link: resultLink.trim() || null,
    });
    if (!error) {
      setResultTitle("");
      setResultBody("");
      setResultLink("");
      const settings = emailSettings || (await loadEmailSettings());
      const client = clients.find((c) => c.id === selectedClientId);
      let notified = false;
      if (settings && client && client.email) {
        const res = await sendEmailNotification(settings, {
          to_email: client.email,
          to_name: client.full_name || "there",
          subject: `Your results are ready: "${resultTitle.trim()}"`,
          heading: `We've sent you results for "${resultTitle.trim()}"`,
          message_body: resultBody.trim() || "Log in to your Maoni page to view it.",
        });
        notified = res.ok;
      }
      setResultFlash(notified ? "Sent — client notified by email." : "Sent to client.");
      setTimeout(() => setResultFlash(""), 3000);
      loadClientThread(selectedClientId);
    }
    setResultBusy(false);
  }

  const pendingCount = submissions.filter((s) => s.status === "pending").length;
  const visibleAdminItems =
    adminFilter === "all" ? submissions : submissions.filter((s) => s.status === adminFilter);
  const myUnreadCount = myMessages.filter((m) => m.sender_role === "admin" && !m.read_at).length;
  const selectedClient = clients.find((c) => c.id === selectedClientId) || null;

  return (
    <div className="maoni-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

        .maoni-root {
          --bg: #0A0D13;
          --panel: #12161F;
          --elevated: #171C27;
          --border: #262C3A;
          --text: #EDEFF3;
          --text-dim: #8A93A6;
          --accent: #E8A33D;
          --accent-strong: #F2B65B;
          --success: #3FAE6B;
          --success-bg: rgba(63,174,107,0.12);
          --pending-bg: rgba(232,163,61,0.12);
          --danger: #E0616B;
          font-family: 'Inter', sans-serif;
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
          width: 100%;
          box-sizing: border-box;
        }
        .maoni-root *, .maoni-root *::before, .maoni-root *::after { box-sizing: border-box; }
        .maoni-root h1, .maoni-root h2, .maoni-root h3 {
          font-family: 'Sora', sans-serif;
          margin: 0;
          letter-spacing: -0.01em;
        }
        .maoni-root button { font-family: 'Inter', sans-serif; cursor: pointer; }
        .maoni-root input, .maoni-root textarea {
          font-family: 'Inter', sans-serif;
        }
        .maoni-root a { color: var(--accent); }

        /* ---------- auth screen ---------- */
        .auth-wrap {
          min-height: 100vh;

                  ) : submissions.length === 0 ? (
                    <div className="empty-state">
                      Nothing sent yet. Use the form to send your first suggestion — it'll show up
                      here with its status.
                    </div>
                  ) : (
                    submissions.map((s) => (
                      <div className="sug-row" key={s.id}>
                        <div className="sug-row-top">
                          <div>
                            <div className="sug-title">{s.title}</div>
                            <div className="sug-message">{s.body}</div>
                          </div>
                          {s.status === "completed" ? (
                            <span className="pill pill-completed"><CheckCircle2 size={13} /> Completed</span>
                          ) : (
                            <span className="pill pill-pending"><Clock3 size={13} /> Pending</span>
                          )}
                        </div>
                        <div className="sug-meta">Sent {formatDate(s.created_at)}</div>
                      </div>
                    ))
                  )}
                </div>

                <div>
                  <div className="list-heading">
                    <h2 style={{ display: "flex", alignItems: "center", gap: 7 }}><Gift size={16} /> Your results</h2>
                    <span className="count-tag">{myResults.length} received</span>
                  </div>
                  {myResults.length === 0 ? (
                    <div className="empty-state">Nothing sent to you yet.</div>
                  ) : (
                    myResults.map((r) => (
                      <div className="result-card" key={r.id}>
                        <div className="result-title"><Gift size={14} /> {r.title}</div>
                        {r.body && <div className="result-body">{r.body}</div>}
                        {r.link && (
                          <a className="result-link" href={r.link} target="_blank" rel="noreferrer">
                            <Link2 size={13} /> Open link
                          </a>
                        )}
                        <div className="result-meta">Sent {formatDate(r.created_at)}</div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      ) : (
        <div className="dash">
          <div className="dash-header">
            <div className="wordmark">
              <span className="wordmark-dot" />
              Maoni
              <span className="admin-tag">ADMIN</span>
            </div>
            <div className="dash-header-right">
              <button className="icon-btn" onClick={() => setShowSettings(true)} title="Notification settings">
                <Settings size={16} />
              </button>
              <div className="badge-wrap">
                <div className="icon-btn"><Bell size={16} /></div>
                {pendingCount > 0 && <span className="badge-dot">{pendingCount}</span>}
              </div>
              <span className="who">Signed in as <strong>{currentUser.company}</strong></span>
              <button className="logout-btn" onClick={handleLogout}>
                <LogOut size={14} /> Log out
              </button>
            </div>
          </div>

          <div className="dash-body">
            <div className="admin-tabs">
              <button className={`admin-tab-btn ${adminTab === "suggestions" ? "active" : ""}`} onClick={() => setAdminTab("suggestions")}>
                All suggestions
              </button>
              <button className={`admin-tab-btn ${adminTab === "clients" ? "active" : ""}`} onClick={() => setAdminTab("clients")}>
                Clients &amp; messages
              </button>
            </div>

            {adminTab === "suggestions" ? (
              <React.Fragment>
                <div className="list-heading">
                  <h2>All client suggestions</h2>
                  <span className="count-tag">{pendingCount} pending · {submissions.length} total</span>
                </div>

                {adminFlash && <div className="flash-msg" style={{ marginBottom: 16 }}>{adminFlash}</div>}

                <div className="filter-row">
                  <button className={`filter-chip ${adminFilter === "all" ? "active" : ""}`} onClick={() => setAdminFilter("all")}>All</button>
                  <button className={`filter-chip ${adminFilter === "pending" ? "active" : ""}`} onClick={() => setAdminFilter("pending")}>Pending</button>
                  <button className={`filter-chip ${adminFilter === "completed" ? "active" : ""}`} onClick={() => setAdminFilter("completed")}>Completed</button>
                </div>

                {subsLoading ? (
                  <div className="footnote">Loading…</div>
                ) : visibleAdminItems.length === 0 ? (
                  <div className="empty-state">
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                      <Inbox size={16} />
                      <span style={{ color: "var(--text)" }}>Nothing here yet</span>
                    </div>
                    No suggestions match this filter right now.
                  </div>
                ) : (
                  visibleAdminItems.map((s) => (
                    <div className="sug-row" key={s.id}>
                      <div className="sug-row-top">
                        <div>
                          <div className="sug-title">{s.title}</div>
                          <div className="sug-message">{s.body}</div>
                        </div>
                        <button
                          className={`status-btn ${s.status === "completed" ? "is-completed" : "is-pending"}`}
                          onClick={() => toggleStatus(s)}
                        >
                          {s.status === "completed" ? <CheckCircle2 size={14} /> : <Clock3 size={14} />}
                          {s.status === "completed" ? "Completed" : "Mark complete"}
                        </button>
                      </div>
                      <div className="sug-meta">
                        <span className="sug-client">{(s.profiles && s.profiles.full_name) || "Unknown"}</span>
                        {s.profiles && s.profiles.email && <span>· {s.profiles.email}</span>}
                        <span>· Sent {formatDate(s.created_at)}</span>
                      </div>
                    </div>
                  ))
                )}
              </React.Fragment>
            ) : (
              <div className="clients-grid">
                <div className="client-list">
                  {clients.length === 0 && <div className="empty-state">No clients yet.</div>}
                  {clients.map((c) => {
                    const unread = c.id === selectedClientId
                      ? 0
                      : null; // computed lazily only for selected thread; keep list simple
                    return (
                      <button
                        key={c.id}
                        className={`client-list-item ${selectedClientId === c.id ? "active" : ""}`}
                        onClick={() => setSelectedClientId(c.id)}
                      >
                        <div className="name">{c.full_name || c.email}</div>
                        <div className="sub">{c.email}</div>
                      </button>
                    );
                  })}
                </div>

                {!selectedClient ? (
                  <div className="empty-state">Pick a client on the left to chat with them or send results.</div>
                ) : (
                  <div className="stack">
                    <div className="panel-box">
                      <h2 style={{ display: "flex", alignItems: "center", gap: 7 }}>
                        <MessageSquare size={16} /> {selectedClient.full_name || selectedClient.email}
                      </h2>
                      <p className="panel-sub">{selectedClient.email}</p>
                      <div className="chat-box">
                        <div className="chat-scroll" ref={adminChatScrollRef}>
                          {adminChatMessages.length === 0 ? (
                            <div className="chat-empty">No messages with this client yet.</div>
                          ) : (
                            adminChatMessages.map((m) => (
                              <div className={`chat-bubble-row ${m.sender_role === "admin" ? "me" : ""}`} key={m.id}>
                                <div>
                                  <div className={`chat-bubble ${m.sender_role === "admin" ? "me" : "them"}`}>
                                    {m.body}
                                  </div>
                                  <div className="chat-bubble-time">{formatTime(m.created_at)}</div>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                        <form className="chat-input-row" onSubmit={handleAdminSendChat}>
                          <input
                            className="field-input"
                            placeholder="Type a message…"
                            value={adminChatDraft}
                            onChange={(e) => setAdminChatDraft(e.target.value)}
                          />
                          <button className="chat-send-btn" type="submit" disabled={adminChatSending || !adminChatDraft.trim()}>
                            <Send size={15} />
                          </button>
                        </form>
                      </div>
                    </div>

                    <div className="panel-box">
                      <h2 style={{ display: "flex", alignItems: "center", gap: 7 }}><Gift size={16} /> Send results</h2>
                      <p className="panel-sub">This appears instantly on the client's own page.</p>
                      <form onSubmit={handleSendResult}>
                        <div className="field-group">
                          <label className="field-label">Title</label>
                          <input
                            className="field-input"
                            style={{ paddingLeft: 13 }}
                            placeholder="e.g. Updated homepage banner"
                            value={resultTitle}
                            onChange={(e) => setResultTitle(e.target.value)}
                          />
                        </div>
                        <div className="field-group">
                          <label className="field-label">Details (optional)</label>
                          <textarea
                            className="field-input"
                            style={{ paddingLeft: 13 }}
                            placeholder="Describe what you delivered"
                            value={resultBody}
                            onChange={(e) => setResultBody(e.target.value)}
                          />
                        </div>
                        <div className="field-group">
                          <label className="field-label">Link (optional)</label>
                          <div className="field-input-wrap">
                            <Link2 size={16} />
                            <input
                              className="field-input"
                              placeholder="https://…"
                              value={resultLink}
                              onChange={(e) => setResultLink(e.target.value)}
                            />
                          </div>
                        </div>
                        <button className="btn-primary" type="submit" disabled={resultBusy || !resultTitle.trim()}>
                          {resultBusy ? "Sending…" : "Send to client"}
                        </button>
                        {resultFlash && <div className="flash-msg">{resultFlash}</div>}
                      </form>
                    </div>

                    {clientSuggestions.length > 0 && (
                      <div>
                        <div className="list-heading">
                          <h2>Their suggestions</h2>
                          <span className="count-tag">{clientSuggestions.length}</span>
                        </div>
                        {clientSuggestions.map((s) => (
                          <div className="sug-row" key={s.id}>
                            <div className="sug-row-top">
                              <div>
                                <div className="sug-title">{s.title}</div>
                                <div className="sug-message">{s.body}</div>
                              </div>
                              <button
                                className={`status-btn ${s.status === "completed" ? "is-completed" : "is-pending"}`}
                                onClick={() => toggleStatus(s)}
                              >
                                {s.status === "completed" ? <CheckCircle2 size={14} /> : <Clock3 size={14} />}
                                {s.status === "completed" ? "Completed" : "Mark complete"}
                              </button>
                            </div>
                            <div className="sug-meta">Sent {formatDate(s.created_at)}</div>
                          </div>
                        ))}
                      </div>
                    )}

                    {clientResults.length > 0 && (
                      <div>
                        <div className="list-heading">
                          <h2>Results already sent</h2>
                          <span className="count-tag">{clientResults.length}</span>
                        </div>
                        {clientResults.map((r) => (
                          <div className="result-card" key={r.id}>
                            <div className="result-title"><Gift size={14} /> {r.title}</div>
                            {r.body && <div className="result-body">{r.body}</div>}
                            {r.link && (
                              <a className="result-link" href={r.link} target="_blank" rel="noreferrer">
                                <Link2 size={13} /> Open link
                              </a>
                            )}
                            <div className="result-meta">Sent {formatDate(r.created_at)}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>

          {showSettings && (
            <div className="modal-overlay" onClick={() => setShowSettings(false)}>
              <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                <div className="modal-head">
                  <h2 style={{ fontSize: 18, fontWeight: 600 }}>Email notifications</h2>
                  <button className="icon-btn" onClick={() => setShowSettings(false)}>
                    <X size={16} />
                  </button>
                </div>
                <p className="panel-sub" style={{ marginBottom: 18 }}>
                  Powered by EmailJS, a service that can send email straight from the browser —
                  no server needed. Create a free account at emailjs.com, connect your inbox, and
                  make one email template with the variables <code>to_email</code>,{" "}
                  <code>to_name</code>, <code>subject</code>, <code>heading</code> and{" "}
                  <code>message_body</code>. Then paste the three IDs it gives you below.
                </p>
                <form onSubmit={handleSaveSettings}>
                  <div className="field-group">
                    <label className="field-label">Your email (receives new-suggestion + chat alerts)</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      type="email"
                      placeholder="you@example.com"
                      value={settingsForm.notifyEmail}
                      onChange={(e) => setSettingsForm({ ...settingsForm, notifyEmail: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Service ID</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="service_xxxxxxx"
                      value={settingsForm.serviceId}
                      onChange={(e) => setSettingsForm({ ...settingsForm, serviceId: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Template ID</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="template_xxxxxxx"
                      value={settingsForm.templateId}
                      onChange={(e) => setSettingsForm({ ...settingsForm, templateId: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Public Key</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="public key from Account > API Keys"
                      value={settingsForm.publicKey}
                      onChange={(e) => setSettingsForm({ ...settingsForm, publicKey: e.target.value })}
                    />
                  </div>
                  <button className="btn-primary" type="submit">
                    Save settings
                  </button>
                  {settingsSaved && (
                    <div className="flash-msg" style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6 }}>
                      <CheckCircle size={14} /> Settings saved.
                    </div>
                  )}
                </form>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MaoniApp />);
</script>
</body>
</html>
